name: Lua checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: find Workshop -name '*.lua' -print0 | xargs -0 -r -n 1 luac5.1 -p
      - run: lua5.1 tests/rules_test.lua

      - run: lua5.1 tests/mock_test.lua

      - run: lua5.1 tests/mp_policy_test.lua
      - run: lua5.1 tests/container_locks_test.lua
      - run: lua5.1 tests/lock_service_test.lua
      - run: lua5.1 tests/batch_test.lua
