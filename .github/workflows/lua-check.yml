name: Lua checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: find Workshop -name '*.lua' -exec luac5.1 -p {} \;
      - run: lua5.1 tests/rules_test.lua
